<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#3B82F6"/>
  <!-- Graduation cap base -->
  <polygon points="32,16 12,26 32,36 52,26" fill="#FFFFFF"/>
  <!-- Cap brim shadow -->
  <polygon points="32,36 12,26 12,30 32,40 52,30 52,26" fill="#DBEAFE"/>
  <!-- Cap tassel line -->
  <line x1="42" y1="22" x2="42" y2="38" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="42" cy="39" r="2.5" fill="#FBBF24"/>
  <!-- Rising arrow (fresh start) -->
  <path d="M20,48 L28,40 L36,44 L46,32" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polygon points="46,32 42,34 44,38" fill="#10B981"/>
</svg>
