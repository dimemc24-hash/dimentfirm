<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Diment & Associates</title>
    <script>
      // Single-page app redirect for GitHub Pages
      // Keeps /dimentfirm/ prefix, redirects path into query string for index.html to pick up
      var repo = '/dimentfirm';
      var l = window.location;
      var path = l.pathname.slice(repo.length);
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repo + '/?/' +
        path.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
